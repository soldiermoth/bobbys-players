- short_name: 'VideoJS'
  long_name: 'VideoJS'
  url: '/players/videojs'
  sidebar: true
  description: >
    Video.js is a web video player built from the ground up for an HTML5 world.
    It supports HTML5 video and modern streaming formats, as well as YouTube,
    Vimeo, and even Flash (through plugins, more on that later).

- short_name: 'Shaka'
  long_name: 'Shaka Player'
  url: '/players/shaka'
  sidebar: true
  description: >
    Shaka Player is an open-source JavaScript library for adaptive media.
    It plays adaptive media formats (such as DASH and HLS) in a browser,
    without using plugins or Flash. Instead, Shaka Player uses the open web
    standards MediaSource Extensions and Encrypted Media Extensions.

- short_name: 'Plyr'
  long_name: 'Plyr'
  url: '/players/plyr'
  sidebar: true
  description: >
    Plyr is a simple, lightweight, accessible and customizable HTML5, YouTube and Vimeo media player that supports modern browsers.

- short_name: 'Mux'
  long_name: 'Mux Player'
  url: '/players/mux'
  sidebar: true
  description: >
    Mux Player is a web component for video playback that supports HLS and DASH streaming.
    Built by Mux, it provides a modern, customizable player with built-in performance monitoring
    and advanced playback features.

