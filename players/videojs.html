---
layout: default
title: Video JS (7.15.4)
css:
- https://vjs.zencdn.net/7.15.4/video-js.css
js:
- https://vjs.zencdn.net/7.15.4/video.min.js
kinds:
  HLS: "application/x-mpegURL"
  Dash: "application/dash+xml"
---

{% include playform.html persist="videojs" %}

<section>
  <video
    width="600"
    height="300"
    id="example"
    class="video-js vjs-default-skin center-block"
    controls></video>
</section>

<script>
const player = videojs('example'),
      manifest = document.getElementById('manifest'),
      kind = document.getElementById('kind');
document.getElementById('playform').onsubmit = () => {
  persistAll();
  player.src({
    src: manifest.value,
    type: kind.value,
  });
  player.play();
  return false;
};
</script>
